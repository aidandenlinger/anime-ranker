name: Check
on: push

permissions: {}

env:
  NIX_DEV: nix develop --no-update-lock-file .#ci --command

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # We will not perform any other git operations in this repo
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Install dependencies
        run: ${{ env.NIX_DEV }} pnpm install --frozen-lockfile

      - name: Check
        run: ${{ env.NIX_DEV }} pnpm run ci
